name: PHP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_PRIVATE: ${{ vars.KEY_PRIVATE }}
      KEY_PUBLIC: ${{ vars.KEY_PUBLIC }}
      KEY_INTEGRETY: ${{ vars.KEY_INTEGRETY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Display PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create .env file
        run: |
          echo "KEY_PRIVATE=${KEY_PRIVATE}" >> .env
          echo "KEY_PUBLIC=${KEY_PUBLIC}" >> .env
          echo "KEY_INTEGRETY=${KEY_INTEGRETY}" >> .env

      - name: Run PHPUnit Tests
        run: composer run-script test